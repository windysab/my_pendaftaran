        .cctv-grid {

        .cctv-card {

            border-radius: 5px;

        }

        .cctv-icon {
            width: 24px;
            height: 24px;
            background-color: #ffc107;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cctv-feed {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .cctv-controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            opacity: 0.7;
        }

        .cctv-controls:hover {
            opacity: 1;
        }

        .control-button {
            background-color: rgba(0,0,0,0.5);
            color: white;
            border: none;
            border-radius: 3px;

            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .control-button:hover {

        .progress-bar {

            background-color: rgba(255,255,255,0.3);

            bottom: 0;
            left: 0;
            right: 0;
        }

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        // Handle row display selection
        document.getElementById('baris').addEventListener('change', function() {
            const rows = parseInt(this.value);
            const grid = document.querySelector('.cctv-grid');

            // Show all cards first
            document.querySelectorAll('.cctv-card').forEach(card => {
                card.style.display = 'block';
            });

            // Calculate how many cards to show based on rows (3 cards per row)
            const cardsToShow = rows * 3;
            const cards = document.querySelectorAll('.cctv-card');

            // Hide cards beyond the selected number of rows
            for (let i = cardsToShow; i < cards.length; i++) {
                cards[i].style.display = 'none';
            }
        });

        // Handle expand button clicks
        document.querySelectorAll('.fa-expand').forEach(button => {
            button.parentElement.addEventListener('click', function() {
                const card = this.closest('.cctv-card');
                const title = card.querySelector('.cctv-title').textContent;
                const iframe = card.querySelector('iframe');
                const src = iframe.src;

                // Set modal title and iframe source
                document.getElementById('fullscreenModalLabel').textContent = title;
                document.getElementById('fullscreenFeed').src = src;

                // Show modal
                $('#fullscreenModal').modal('show');
            });
        });

        // Handle play/pause button clicks
        document.querySelectorAll('.fa-play').forEach(button => {
            button.parentElement.addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (icon.classList.contains('fa-play')) {
                    icon.classList.remove('fa-play');
                    icon.classList.add('fa-pause');
                } else {
                    icon.classList.remove('fa-pause');
                    icon.classList.add('fa-play');
                }
            });
        });

        // Handle mute/unmute button clicks
        document.querySelectorAll('.fa-volume-mute').forEach(button => {
            button.parentElement.addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (icon.classList.contains('fa-volume-mute')) {
                    icon.classList.remove('fa-volume-mute');
                    icon.classList.add('fa-volume-up');
                } else {
                    icon.classList.remove('fa-volume-up');
                    icon.classList.add('fa-volume-mute');
                }
            });
        });

        // Simulate progress bar movement
        function updateProgressBars() {
            document.querySelectorAll('.progress').forEach(bar => {
                let width = parseFloat(bar.style.width) || 50;
                width += 0.1;
                if (width > 100) width = 0;
                bar.style.width = width + '%';
            });

            setTimeout(updateProgressBars, 100);
        }

        // Start progress bar animation
        updateProgressBars();
    </script>
